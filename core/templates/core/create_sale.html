{% extends 'core/base.html' %}
{% block title %}إنشاء بيع | نظام الشهابي{% endblock %}
{% block content %}
<section class="panel">
  <h2>إنشاء عملية بيع (متعدد الأصناف)</h2>

  <form method="get" style="margin-bottom:12px;">
    <label>الفرع</label>
    <select name="branch_id" onchange="this.form.submit()">
      <option value="">-- اختر الفرع --</option>
      {% for b in branches %}
      <option value="{{ b.id }}" {% if selected_branch_id == b.id|stringformat:'s' %}selected{% endif %}>{{ b.name }}</option>
      {% endfor %}
    </select>
  </form>

  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="branch_id" value="{{ selected_branch_id }}">
    {% for i in '123' %}
    <fieldset style="margin-bottom:10px"><legend>صنف {{ forloop.counter }}</legend>
      <label>الصنف/المخزون</label>
      <select name="inventory_id"><option value="">--</option>{% for inv in inventories %}<option value="{{ inv.id }}">{{ inv.product.name }} ({{ inv.dabba_count }} دبة / {{ inv.kg_amount }} كجم)</option>{% endfor %}</select>
      <label>عدد الدبات</label><input type="number" step="0.01" name="dabba_qty" value="0">
      <label>الكمية بالكجم</label><input type="number" step="0.01" name="kg_qty" value="0">
      <label>سعر الوحدة</label><input type="number" step="0.01" name="unit_price_input" value="0">
    </fieldset>
    {% endfor %}

    <label>نوع الحساب</label>
    <select name="account_type">
      <option value="cash" {% if pref.last_account_type == 'cash' %}selected{% endif %}>نقدي</option>
      <option value="employee" {% if pref.last_account_type == 'employee' %}selected{% endif %}>على العامل/الصاحب</option>
      <option value="debt" {% if pref.last_account_type == 'debt' %}selected{% endif %}>دين عميل</option>
    </select>

    {% if employee.role != 'owner' %}
    <label>العملة</label>
    <select name="currency"><option value="SAR" {% if pref.last_currency == 'SAR' %}selected{% endif %}>SAR</option><option value="YER_BIG" {% if pref.last_currency == 'YER_BIG' %}selected{% endif %}>YER_BIG</option><option value="YER_SMALL" {% if pref.last_currency == 'YER_SMALL' %}selected{% endif %}>YER_SMALL</option></select>
    {% endif %}

    <label>العميل (اختياري)</label>
    <select name="customer_id"><option value="">--</option>{% for c in customers %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select>
    <label>حساب المدير (للبيع النقدي)</label>
    <select name="manager_account_id"><option value="">--</option>{% for m in manager_accounts %}<option value="{{ m.id }}" {% if pref.last_manager_account == m.id|stringformat:'s' %}selected{% endif %}>{{ m.name }}</option>{% endfor %}</select>
    <button type="submit">حفظ البيع</button>
  </form>
</section>
{% endblock %}

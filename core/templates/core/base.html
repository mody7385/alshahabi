{% load static %}
<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}نظام الشهابي{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img src="{% static 'core/img/logo.svg' %}" alt="شعار الشهابي" class="logo">
    <div>
      <h1>نظام الشهابي للعسل</h1>
      <p>واجهة عربية حديثة - RTL</p>
    </div>
  </div>
  <nav class="topnav">
    <a href="/?role=admin">وضع المدير</a>
    <a href="/?role=owner">وضع الصاحب</a>
    <a href="/?role=worker">وضع العامل</a>
  </nav>
</header>
<main class="container">{% block content %}{% endblock %}</main>
<footer class="footer">© الشهابي للعسل الحضري</footer>
</body>
</html>
